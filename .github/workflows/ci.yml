name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build extension (dist/)
        run: npm run build

      - name: Type-check
        run: npm run check

      - name: Unit + jsdom smoke tests
        run: npm test

      - name: dist/ is up to date with src/
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git status --porcelain dist
            git --no-pager diff --stat dist
            exit 1
          fi

      - name: Validate manifest
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            const pkg = require('./package.json');
            if (m.manifest_version !== 3) throw new Error('manifest_version must be 3');
            if (m.version !== pkg.version) throw new Error('manifest version ' + m.version + ' != package version ' + pkg.version);
            for (const cs of m.content_scripts) for (const f of [...(cs.js || []), ...(cs.css || [])]) require('fs').accessSync('dist/' + f);
            require('fs').accessSync('dist/' + m.background.service_worker);
            console.log('dist/manifest.json OK (v' + m.version + ')');
          "

      - name: Package
        run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: mashiro-extension
          path: mashiro-*.zip
          if-no-files-found: error
