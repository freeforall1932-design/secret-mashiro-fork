name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build extension (dist/)
        run: npm run build

      - name: Type-check
        run: npm run check

      - name: Unit + jsdom smoke tests
        run: npm test

      - name: dist/ and dist-firefox/ are up to date with src/
        run: |
          if [ -n "$(git status --porcelain dist dist-firefox)" ]; then
            echo "::error::dist/ or dist-firefox/ is stale. Run 'npm run build' and commit the result."
            git status --porcelain dist dist-firefox
            git --no-pager diff --stat dist dist-firefox
            exit 1
          fi

      - name: Validate manifests
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            for (const dir of ['dist', 'dist-firefox']) {
              const m = JSON.parse(fs.readFileSync(dir + '/manifest.json', 'utf8'));
              if (m.manifest_version !== 3) throw new Error(dir + ': manifest_version must be 3');
              if (m.version !== pkg.version) throw new Error(dir + ': manifest version ' + m.version + ' != package version ' + pkg.version);
              for (const cs of m.content_scripts) for (const f of [...(cs.js || []), ...(cs.css || [])]) fs.accessSync(dir + '/' + f);
              const bg = m.background.service_worker ? [m.background.service_worker] : m.background.scripts;
              for (const f of bg) fs.accessSync(dir + '/' + f);
              if (dir === 'dist-firefox' && !m.browser_specific_settings?.gecko?.id) throw new Error('Firefox manifest needs a gecko id');
              console.log(dir + '/manifest.json OK (v' + m.version + ')');
            }
          "

      - name: Package
        run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: mashiro-extension
          path: mashiro-*.zip
          if-no-files-found: error
