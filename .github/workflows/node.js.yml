# This repository is a Chrome extension (Manifest V3), not a Node.js project:
# there is no package.json, no npm dependencies, no build step, and no test
# suite. The Node.js CI template (setup-node + npm ci + npm test) therefore
# does not apply here. Instead, this workflow validates the extension itself:
# manifest.json must be valid JSON, every JavaScript file must parse, and all
# required files must be present.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate manifest.json
      run: node -e "const m = JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); if (m.manifest_version !== 3) throw new Error('manifest_version must be 3'); console.log('manifest.json is valid JSON (Manifest V3)')"

    - name: Syntax-check JavaScript files
      run: |
        set -e
        for f in *.js; do
          node --check "$f"
          echo "OK: $f"
        done

    - name: Verify extension structure
      run: |
        test -f manifest.json
        test -f background.js
        test -f foreground.js
        test -f foreground_styles.css
        test -f jquery-3.6.0.min.js
        test -d images
        echo "Extension structure OK"
